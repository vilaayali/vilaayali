<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none">
<defs>
<linearGradient id="vc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#4A5268" opacity="0.5"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
  <stop offset="0" stop-color="#F4F5F8"/><stop offset=".42" stop-color="#F4F5F8"/>
  <stop offset=".5" stop-color="#22D3EE"/><stop offset=".58" stop-color="#F4F5F8"/><stop offset="1" stop-color="#F4F5F8"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;1 0" keyTimes="0;.45;1" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="core"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".9"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
<linearGradient id="leftfade" x1="0" x2="1"><stop offset="0" stop-color="#07080C"/><stop offset=".5" stop-color="#07080C" stop-opacity=".75"/><stop offset="1" stop-color="#07080C" stop-opacity="0"/></linearGradient>
<linearGradient id="star" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<style>
text { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
.mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes blink { 50% { opacity: 0 } }
@keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes ping { 0% { r: 4; opacity: .9 } 100% { r: 30; opacity: 0 } }
@keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
.up { animation: up .9s cubic-bezier(.2,.7,.2,1) both; }

.orbit1 { transform-origin: 960px 220px; animation: spin 30s linear infinite; }
.orbit2 { transform-origin: 960px 220px; animation: spin 46s linear infinite reverse; }
.upright1 { transform-box: fill-box; transform-origin: center; animation: spin 30s linear infinite reverse; }
.upright2 { transform-box: fill-box; transform-origin: center; animation: spin 46s linear infinite; }
.role { opacity: 0; animation: role 12s cubic-bezier(.2,.7,.2,1) infinite; }
@keyframes role { 0% { opacity: 0; transform: translateY(22px) } 4% { opacity: 1; transform: none }
  22.0% { opacity: 1; transform: none } 25.0% { opacity: 0; transform: translateY(-22px) } 100% { opacity: 0 } }
.a1 { animation: drift1 18s ease-in-out infinite; } .a2 { animation: drift2 22s ease-in-out infinite; } .a3 { animation: drift3 26s ease-in-out infinite; }
@keyframes drift1 { 50% { transform: translate(-140px, 60px) } }
@keyframes drift2 { 50% { transform: translate(120px, -50px) } }
@keyframes drift3 { 50% { transform: translate(-60px, -70px) } }
.shoot { animation: shoot 7s ease-in infinite; }
@keyframes shoot { 0%,70% { transform: translate(0,0); opacity: 0 } 72% { opacity: 1 } 85%,100% { transform: translate(-520px, 260px); opacity: 0 } }
.caret { animation: blink 1s steps(1) infinite; }
.pulse { animation: pulse 1.8s ease-in-out infinite; }
.ring { animation: ping2 2.4s cubic-bezier(0,0,.2,1) infinite; }
@keyframes ping2 { 0% { r: 4; opacity: .9 } 100% { r: 13; opacity: 0 } }
.r0 { animation-delay: 0s; }
.r1 { animation-delay: 3s; }
.r2 { animation-delay: 6s; }
.r3 { animation-delay: 9s; }

</style>
</defs>
