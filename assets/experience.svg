" height="3" fill="#7C5CFF"/><text x="452" y="142" class="mono" font-size="11" fill="#7C5CFF" letter-spacing="1.5">NOV 2024 — MAY 2025</text><text x="452" y="178" font-size="21" font-weight="700" letter-spacing="-.5" fill="#F4F5F8">Junior Software Engineer</text><text x="452" y="204" font-size="15" fill="#8B93A7">Ginkgo Retail · Lahore</text><line x1="452" y1="222" x2="748" y2="222" stroke="#1C2230"/><circle cx="458" cy="246" r="2.5" fill="#7C5CFF"/><text x="470" y="251" font-size="15" fill="#8B93A7">B2B storefront &amp; admin panel</text><circle cx="458" cy="274" r="2.5" fill="#7C5CFF"/><text x="470" y="279" font-size="15" fill="#8B93A7">Reusable component library</text></g><circle cx="832" cy="70" r="9" fill="#0D1017" stroke="#22D3EE" stroke-width="2" class="pop" style="animation-delay:1.30s"/><circle cx="832" cy="70" r="3.5" fill="#22D3EE" class="pop" style="animation-delay:1.30s"/><g class="up" style="animation-delay:1.40s"><rect x="816" y="104" width="336" height="226" rx="18" fill="#121621" stroke="#1C2230"/><rect x="836" y="104" width="44" height="3" fill="#22D3EE"/><text x="836" y="142" class="mono" font-size="11" fill="#22D3EE" letter-spacing="1.5">AUG 2025 — APR 2026</text><text x="836" y="178" font-size="21" font-weight="700" letter-spacing="-.5" fill="#F4F5F8">Associate Software Engineer</text><text x="836" y="204" font-size="15" fill="#8B93A7">Bestel Communications · Lahore</text><line x1="836" y1="222" x2="1132" y2="222" stroke="#1C2230"/><circle cx="842" cy="246" r="2.5" fill="#22D3EE"/><text x="854" y="251" font-size="15" fill="#8B93A7">Real-time app over WebSockets</text><circle cx="842" cy="274" r="2.5" fill="#22D3EE"/><text x="854" y="279" font-size="15" fill="#8B93A7">2× faster with lazy loading</text></g>
</g>
