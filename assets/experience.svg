<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
<defs>
<linearGradient id="vc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#4A5268" opacity="0.5"/></pattern><linearGradient id="vcu" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="1152" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient><filter id="g2" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
text { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
.mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes blink { 50% { opacity: 0 } }
@keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes ping { 0% { r: 4; opacity: .9 } 100% { r: 30; opacity: 0 } }
@keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
.up { animation: up .9s cubic-bezier(.2,.7,.2,1) both; }

.prog { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 2.4s .2s cubic-bezier(.2,.7,.2,1) forwards; }
.pop { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(0) } to { transform: scale(1) } }
</style>
</defs>
<g clip-path="url(#frame)">
