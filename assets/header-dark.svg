<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7C5CFF" stop-opacity="0.35"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0B0D12" stop-opacity="1"/><stop offset="0.55" stop-color="#0B0D12" stop-opacity="0.6"/><stop offset="1" stop-color="#0B0D12" stop-opacity="0"/></linearGradient>
  <clipPath id="r"><rect width="1200" height="360" rx="24"/></clipPath>
  <style>
    .spin { transform-origin: 950px 180px; animation: spin 40s linear infinite; }
    .spinr { transform-origin: 950px 180px; animation: spin 26s linear infinite reverse; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s } .d4 { animation-delay: .55s }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    @keyframes blink { 50% { opacity: 0 } }
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="360" fill="#0B0D12"/>
  <g stroke="#1C2130" stroke-width="1" opacity="0.7"><line x1="0" y1="0" x2="0" y2="360"/><line x1="40" y1="0" x2="40" y2="360"/><line x1="80" y1="0" x2="80" y2="360"/><line x1="120" y1="0" x2="120" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/><line x1="200" y1="0" x2="200" y2="360"/><line x1="240" y1="0" x2="240" y2="360"/><line x1="280" y1="0" x2="280" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/><line x1="360" y1="0" x2="360" y2="360"/><line x1="400" y1="0" x2="400" y2="360"/><line x1="440" y1="0" x2="440" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/><line x1="520" y1="0" x2="520" y2="360"/><line x1="560" y1="0" x2="560" y2="360"/><line x1="600" y1="0" x2="600" y2="360"/><line x1="640" y1="0" x2="640" y2="360"/><line x1="680" y1="0" x2="680" y2="360"/><line x1="720" y1="0" x2="720" y2="360"/><line x1="760" y1="0" x2="760" y2="360"/><line x1="800" y1="0" x2="800" y2="360"/><line x1="840" y1="0" x2="840" y2="360"/><line x1="880" y1="0" x2="880" y2="360"/><line x1="920" y1="0" x2="920" y2="360"/><line x1="960" y1="0" x2="960" y2="360"/><line x1="1000" y1="0" x2="1000" y2="360"/><line x1="1040" y1="0" x2="1040" y2="360"/><line x1="1080" y1="0" x2="1080" y2="360"/><line x1="1120" y1="0" x2="1120" y2="360"/><line x1="1160" y1="0" x2="1160" y2="360"/><line x1="1200" y1="0" x2="1200" y2="360"/><line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/></g>
  <circle cx="950" cy="180" r="260" fill="url(#glow)"/>
  <g fill="none" stroke-width="1.5">
    <circle cx="950" cy="180" r="70" stroke="url(#g)"/>
    <g class="spin">
      <circle cx="950" cy="180" r="120" stroke="#8A93A6" stroke-opacity="0.45" stroke-dasharray="2 8"/>
      <circle cx="1070" cy="180" r="7" fill="#22D3EE" stroke="none"/>
    </g>
    <g class="spinr">
      <circle cx="950" cy="180" r="175" stroke="#8A93A6" stroke-opacity="0.3"/>
      <rect x="944" y="-1" width="12" height="12" rx="3" fill="#7C5CFF" stroke="none"/>
    </g>
    <circle cx="950" cy="180" r="230" stroke="#8A93A6" stroke-opacity="0.18" stroke-dasharray="1 6"/>
  </g>
  <text x="950" y="188" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#F2F4F8">&lt;/&gt;</text>
  <rect width="1200" height="360" fill="url(#fade)"/>

  <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="2" fill="#8A93A6">
    <text x="64" y="80" class="rise d1">PORTFOLIO — 2026</text>
  </g>
  <text x="62" y="168" class="rise d2" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-3" fill="#F2F4F8">Syed Vilaay Ali<tspan fill="url(#g)">.</tspan></text>
  <text x="64" y="214" class="rise d3" font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="24" font-weight="500" fill="#8A93A6">Software Engineer crafting <tspan fill="#F2F4F8">fast, real-time</tspan> web products.</text>
  <g class="rise d4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="14" fill="#8A93A6">
    <rect x="64" y="262" width="152" height="38" rx="19" fill="#11141B" stroke="#1C2130"/>
    <circle cx="86" cy="281" r="5" fill="#22C55E" class="pulse"/>
    <text x="100" y="286" fill="#F2F4F8">Open to work</text>
    <text x="240" y="286">React · Next.js · Node.js</text>
    <text x="462" y="286">— Lahore, PK<tspan class="caret" fill="#22D3EE"> _</tspan></text>
  </g>
</g>
<rect x="0.5" y="0.5" width="1199" height="359" rx="24" fill="none" stroke="#1C2130"/>
</svg>