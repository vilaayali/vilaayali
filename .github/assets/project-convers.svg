<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
<defs>
<linearGradient id="vc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<clipPath id="frame"><rect width="600" height="340" rx="24"/></clipPath>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#7C5CFF"/><stop offset=".3" stop-color="#1C2230"/><stop offset=".7" stop-color="#1C2230"/><stop offset="1" stop-color="#22D3EE"/>
<animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="spot" cx=".8" cy=".2" r=".7"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".22"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
<style>
text { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
.mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes blink { 50% { opacity: 0 } }
@keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes ping { 0% { r: 4; opacity: .9 } 100% { r: 30; opacity: 0 } }
@keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
.up { animation: up .9s cubic-bezier(.2,.7,.2,1) both; }

.bar { transform-box: fill-box; transform-origin: bottom; animation: grow 2.6s cubic-bezier(.2,.7,.2,1) infinite alternate; }
@keyframes grow { from { transform: scaleY(.2) } to { transform: scaleY(1) } }
.float { animation: float 3.2s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px) } }
.shim { animation: shim 1.8s linear infinite; }
@keyframes shim { from { transform: translateX(-140px) } to { transform: translateX(160px) } }
.bounce { transform-box: fill-box; transform-origin: center; animation: bounce 2s cubic-bezier(.3,1.6,.5,1) infinite; }
@keyframes bounce { 0%,60%,100% { transform: scale(1) } 70% { transform: scale(1.35) } }
.typing { animation: blink 1s steps(1) infinite; }

</style>
</defs>
<g clip-path="url(#frame)">

<rect width="600" height="340" rx="24" fill="#0D1017"/>
<rect width="600" height="340" fill="url(#spot)"/>
<text x="32" y="50" class="mono" font-size="12" fill="#8B93A7" letter-spacing="1.5">02 — ADMIN PANEL</text>
<text x="32" y="96" font-size="28" font-weight="800" letter-spacing="-1" fill="#F4F5F8">Convers by Ginkgo</text>
<rect x="32" y="112" width="40" height="3" rx="1.5" fill="url(#vc)"/>
<text x="32" y="150" font-size="15" fill="#8B93A7">Responsive admin panel with</text><text x="32" y="174" font-size="15" fill="#8B93A7">dynamic routing, validated</text><text x="32" y="198" font-size="15" fill="#8B93A7">forms and a reusable component</text><text x="32" y="222" font-size="15" fill="#8B93A7">system.</text>
<rect x="32" y="276" width="57" height="28" rx="14" fill="#121621" stroke="#1C2230"/><text x="60" y="295" text-anchor="middle" class="mono" font-size="12" fill="#F4F5F8">React</text><rect x="97.0" y="276" width="73" height="28" rx="14" fill="#121621" stroke="#1C2230"/><text x="133" y="295" text-anchor="middle" class="mono" font-size="12" fill="#F4F5F8">Next.js</text><rect x="177.6" y="276" width="41" height="28" rx="14" fill="#121621" stroke="#1C2230"/><text x="198" y="295" text-anchor="middle" class="mono" font-size="12" fill="#F4F5F8">MUI</text>
<g transform="translate(360,60)"><rect width="210" height="220" rx="16" fill="#121621" stroke="#1C2230"/><rect x="0" y="0" width="44" height="220" rx="16" fill="#0D1017"/><rect x="12" y="20" width="20" height="10" rx="3" fill="#1C2230"/><rect x="12" y="46" width="20" height="10" rx="3" fill="#7C5CFF"/><rect x="12" y="72" width="20" height="10" rx="3" fill="#1C2230"/><rect x="12" y="98" width="20" height="10" rx="3" fill="#1C2230"/><rect x="12" y="124" width="20" height="10" rx="3" fill="#1C2230"/><rect x="58" y="18" width="86" height="10" rx="5" fill="#1C2230"/><rect x="58" y="36" width="56" height="8" rx="4" fill="#1C2230" opacity=".6"/><rect x="60" y="136" width="14" height="60" rx="4" fill="url(#vc)" class="bar" style="animation-delay:-0.00s"/><rect x="83" y="100" width="14" height="96" rx="4" fill="url(#vc)" class="bar" style="animation-delay:-0.35s"/><rect x="106" y="124" width="14" height="72" rx="4" fill="url(#vc)" class="bar" style="animation-delay:-0.70s"/><rect x="129" y="76" width="14" height="120" rx="4" fill="url(#vc)" class="bar" style="animation-delay:-1.05s"/><rect x="152" y="108" width="14" height="88" rx="4" fill="url(#vc)" class="bar" style="animation-delay:-1.40s"/><rect x="175" y="64" width="14" height="132" rx="4" fill="url(#vc)" class="bar" style="animation-delay:-1.75s"/><line x1="56" y1="197" x2="196" y2="197" stroke="#1C2230"/></g>

</g>

<rect x="1" y="1" width="598" height="338" rx="23" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
</svg>