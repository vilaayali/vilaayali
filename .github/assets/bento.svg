<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" fill="none">
<defs>
<linearGradient id="vc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<clipPath id="frame"><rect width="600" height="380" rx="24"/></clipPath>

<style>
text { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
.mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes blink { 50% { opacity: 0 } }
@keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes ping { 0% { r: 4; opacity: .9 } 100% { r: 30; opacity: 0 } }
@keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
.up { animation: up .9s cubic-bezier(.2,.7,.2,1) both; }

.ping { animation: ping 2.4s cubic-bezier(0,0,.2,1) infinite; }
.ringdraw { animation: ring 2.2s .4s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes ring { to { stroke-dashoffset: 64.1 } }
.eq { transform-box: fill-box; transform-origin: bottom; animation: eq 1s ease-in-out infinite alternate; }
@keyframes eq { 0% { transform: scaleY(.15) } 100% { transform: scaleY(1) } }

</style>
</defs>
<g clip-path="url(#frame)">
