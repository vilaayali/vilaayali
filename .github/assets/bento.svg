><text x="44" y="80" font-size="24" font-weight="700" fill="#F4F5F8">Open to work</text><text x="20" y="106" font-size="15" fill="#8B93A7">Full-time · Contract</text><rect x="20" y="121" width="118" height="30" rx="15" fill="#F4F5F8"/><text x="79" y="141" text-anchor="middle" font-size="13" font-weight="600" fill="#07080C">Let's talk →</text></g></g><g transform="translate(307,197)"><g class="up" style="animation-delay:0.46s"><rect width="277" height="167" rx="18" fill="#121621" stroke="#1C2230"/><text x="20" y="34" class="mono" font-size="11" fill="#8B93A7" letter-spacing="1.5">RIGHT NOW</text><text x="20" y="74" font-size="20" font-weight="700" fill="#F4F5F8">Shipping real-time UIs</text><text x="20" y="96" font-size="14" fill="#8B93A7">in the zone 🎧</text><rect x="20" y="107" width="7" height="44" rx="3.5" fill="url(#vc)" class="eq" style="animation-duration:0.70s; animation-delay:-0.00s"/><rect x="33" y="107" width="7" height="44" rx="3.5" fill="url(#vc)" class="eq" style="animation-duration:0.80s; animation-delay:-0.13s"/><rect x="46" y="107" width="7" height="44" rx="3.5" fill="url(#vc)" class="eq" style="animation-duration:0.90s; animation-delay:-0.26s"/><rect x="59" y="107" width="7" height="44" rx="3.5" fill="url(#vc)" class="eq" style="animation-duration:1.00s; animation-delay:-0.39s"/><rect x="72" y="107" width="7" height="44" rx="3.5" fill="url(#vc)" class="eq" style="animation-duration:1.10s; animation-delay:-0.52s"/><rect x="85" y="107" width="7" height="44" rx="3.5" fill="url(#vc)" class="eq" style="animation-duration:1.20s; animation-delay:-0.65s"/><rect x="98" y="107" width="7" height="44" rx="3.5" fill="url(#vc)" class="eq" style="animation-duration:1.30s; animation-delay:-0.78s"/><rect x="111" y="107" width="7" height="44" rx="3.5" fill="url(#vc)" class="eq" style="animation-duration:1.40s; animation-delay:-0.91s"/><rect x="124" y="107" width="7" height="44" rx="3.5" fill="url(#vc)" class="eq" style="animation-duration:1.50s; animation-delay:-1.04