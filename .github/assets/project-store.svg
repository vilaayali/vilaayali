<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" fill="none">
<defs>
<linearGradient id="vc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
<clipPath id="frame"><rect width="600" height="340" rx="24"/></clipPath>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#7C5CFF"/><stop offset=".3" stop-color="#1C2230"/><stop offset=".7" stop-color="#1C2230"/><stop offset="1" stop-color="#22D3EE"/>
<animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/></linearGradient>
<radialGradient id="spot" cx=".8" cy=".2" r=".7"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".22"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/></radialGradient>
<style>
text { font-family: 'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif; }
.mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes blink { 50% { opacity: 0 } }
@keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes ping { 0% { r: 4; opacity: .9 } 100% { r: 30; opacity: 0 } }
@keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
.up { animation: up .9s cubic-bezier(.2,.7,.2,1) both; }

.bar { transform-box: fill-box; transform-origin: bottom; animation: grow 2.6s cubic-bezier(.2,.7,.2,1) infinite alternate; }
@keyframes grow { from { transform: scaleY(.2) } to { transform: scaleY(1) } }
.float { animation: float 3.2s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px) } }
.shim { animation: shim 1.8s linear infinite; }
@keyframes shim { from { transform: translateX(-140px) } to { transform: translateX(160px) } }
.bounce { transform-box: fill-box; transform-origin: center; animation: bounce 2s cubic-bezier(.3,1.6,.5,1) infinite; }
@keyframes bounce { 0%,60%,100% { transform: scale(1) } 70% { transform: scale(1.35) } }
.typing { animation: blink 1s steps(1) infinite; }

</style>
</defs>
<g clip-path="url(#frame)">

<rect width="600" height="340" rx="24" fill="#0D1017"/>
<rect width="600" height="340" fill="url(#spot)"/>
<text x="32" y="50" class="mono" font-size="12" fill="#8B93A7" letter-spacing="1.5">03 — E-COMMERCE</text>
<text x="32" y="96" font-size="28" font-weight="800" letter-spacing="-1" fill="#F4F5F8">Sanaullah Store</text>
<rect x="32" y="112" width="40" height="3" rx="1.5" fill="url(#vc)"/>
<text x="32" y="150" font-size="15" fill="#8B93A7">Storefront with live product</text><text x="32" y="174" font-size="15" fill="#8B93A7">and user APIs on a clean,</text><text x="32" y="198" font-size="15" fill="#8B93A7">fully responsive UI.</text>
<rect x="32" y="276" width="57" height="28" rx="14" fill="#121621" stroke="#1C2230"/><text x="60" y="295" text-anchor="middle" class="mono" font-size="12" fill="#F4F5F8">React</text><rect x="97.0" y="276" width="73" height="28" rx="14" fill="#121621" stroke="#1C2230"/><text x="133" y="295" text-anchor="middle" class="mono" font-size="12" fill="#F4F5F8">Next.js</text><rect x="177.6" y="276" width="49" height="28" rx="14" fill="#121621" stroke="#1C2230"/><text x="202" y="295" text-anchor="middle" class="mono" font-size="12" fill="#F4F5F8">Sass</text>
<g transform="translate(360,60)"><rect width="210" height="220" rx="16" fill="#121621" stroke="#1C2230"/><clipPath id="tiles"><rect x="16" y="40" width="84" height="78" rx="12"/><rect x="110" y="40" width="84" height="78" rx="12"/><rect x="16" y="128" width="84" height="78" rx="12"/><rect x="110" y="128" width="84" height="78" rx="12"/></clipPath><rect x="16" y="40" width="84" height="78" rx="12" fill="#0D1017" stroke="#1C2230"/><rect x="26" y="50" width="64" height="38" rx="8" fill="#7C5CFF" opacity=".35"/><rect x="26" y="96" width="44" height="7" rx="3.5" fill="#1C2230"/><rect x="110" y="40" width="84" height="78" rx="12" fill="#0D1017" stroke="#1C2230"/><rect x="120" y="50" width="64" height="38" rx="8" fill="#22D3EE" opacity=".35"/><rect x="120" y="96" width="44" height="7" rx="3.5" fill="#1C2230"/><rect x="16" y="128" width="84" height="78" rx="12" fill="#0D1017" stroke="#1C2230"/><rect x="26" y="138" width="64" height="38" rx="8" fill="#F472B6" opacity=".35"/><rect x="26" y="184" width="44" height="7" rx="3.5" fill="#1C2230"/><rect x="110" y="128" width="84" height="78" rx="12" fill="#0D1017" stroke="#1C2230"/><rect x="120" y="138" width="64" height="38" rx="8" fill="#22C55E" opacity=".35"/><rect x="120" y="184" width="44" height="7" rx="3.5" fill="#1C2230"/><g clip-path="url(#tiles)"><rect class="shim" x="0" y="30" width="50" height="200" fill="#fff" opacity=".07" transform="skewX(-20)"/></g><text x="16" y="26" class="mono" font-size="11" fill="#8B93A7">SHOP</text><path d="M168 12 h6 l4 14 h18 l3 -10 h-23" stroke="#F4F5F8" stroke-width="1.6" fill="none" stroke-linejoin="round"/><circle cx="181" cy="31" r="2" fill="#F4F5F8"/><circle cx="193" cy="31" r="2" fill="#F4F5F8"/><g class="bounce"><circle cx="198" cy="12" r="8" fill="#F472B6"/><text x="198" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text></g></g>

</g>

