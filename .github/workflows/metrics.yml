name: Profile metrics (incl. private repos)

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Overview: activity calendar + totals (counts private repos the token can see)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.overview.svg
          user: vilaayali
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Karachi
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Languages: most used + recently used, across public AND private repos
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          user: vilaayali
          template: classic
          base: ""
          config_timezone: Asia/Karachi
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_ignored: html, css, scss
          plugin_languages_limit: 8
          plugin_languages_details: percentage
