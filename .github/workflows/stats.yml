name: Profile stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build contribution graph + languages card
        env:
          # METRICS_TOKEN (PAT with repo + read:user) lets private work count;
          # falls back to the built-in token (public data only) if it's missing.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/stats.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib.svg assets/languages.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git pull --rebase
          git push
