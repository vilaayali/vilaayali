name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: vilaayali
          outputs: |
            dist/snake-light.svg?color_snake=#7C5CFF&color_dots=#EEEEE8,#D9D2FF,#B3A3FF,#7C5CFF,#22D3EE
            dist/snake-dark.svg?color_snake=#22D3EE&color_dots=#161B22,#2A2350,#4B3A9E,#7C5CFF,#22D3EE

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
